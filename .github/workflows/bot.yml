name: XAUUSD Signal Bot

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xauusd-bot
  cancel-in-progress: false

jobs:
  run-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: |
          pip install pandas

      - name: Botu çalıştır
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DAILY_REPORT: ${{ github.event.schedule == '0 20 * * *' && '1' || '0' }}
        run: |
          python xauusd_bot.py

      - name: Sinyal geçmişini kaydet
        run: |
          git config user.name "XAUUSD Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json signals.json

          git diff --cached --quiet || git commit -m "Update XAUUSD bot state"

          git push