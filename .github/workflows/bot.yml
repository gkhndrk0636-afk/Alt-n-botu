name: XAUUSD Signal Bot

on:
  schedule:
    # Her 15 dakikada bir
    - cron: "*/15 * * * *"

    # Her gün Türkiye saatiyle yaklaşık 23:00
    # UTC 20:00
    - cron: "0 20 * * *"

  workflow_dispatch:

jobs:
  run-bot:

    runs-on: ubuntu-latest

    steps:

      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: |
          pip install pandas

      - name: Botu çalıştır
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DAILY_REPORT: ${{ github.event.schedule == '0 20 * * *' && '1' || '0' }}
        run: |
          python xauusd_bot.py