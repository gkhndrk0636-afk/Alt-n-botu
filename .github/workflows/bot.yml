name: XAUUSD Altin Botu

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Sinyal beklemeden test e-postası gönder"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "*/15 * * * 1-5"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutuphaneleri yukle
        run: pip install -r requirements.txt

      - name: Altin botunu calistir
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python xauusd_bot.py

      - name: Sinyal kaydini sakla
        run: |
          git config user.name "XAUUSD Bot"
          git config user.email "bot@://github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update state.json" && git push)
